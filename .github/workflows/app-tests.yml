# Tests of the Streamlit App (App/) against the agent's mock mode: no API key or network needed.
# Runs when the App or the Agent it imports changes.
name: App tests

on:
  pull_request:
    paths:
      - "App/**"
      - "Agent/**"
      - ".github/workflows/app-tests.yml"
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Agent/**"
      - ".github/workflows/app-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12: inside the agent's tested range; 3.14: what the App is developed on.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: App/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r App/requirements.txt pytest

      - name: Run App tests (mock mode)
        env:
          GEO_AGENT_TRACE: "0"
          GEO_AGENT_MOCK_DELAY: "0"
        run: pytest App/tests -q
