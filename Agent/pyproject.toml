[project]
name = "geo-agent"
version = "0.1.0"
description = "GeoRAG agent: answers geographic questions over a WWII Pacific knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.1",
    "pydantic>=2",
    "shapely>=2",
    "numpy>=1.24",  # imported directly (vectorized name search and spatial prefilter); already required by shapely
    "rapidfuzz>=3",
    "rank-bm25>=0.2",
    "python-dotenv>=1",
]

[project.scripts]
geo-agent = "geo_agent.agent:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geo_agent"]
